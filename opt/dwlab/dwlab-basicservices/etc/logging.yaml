version: 1
disable_existing_loggers: False
formatters:
  simple:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  detailed:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(module)s - %(message)s'

handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: simple
    stream: ext://sys.stdout

  syslog:
    class: logging.handlers.SysLogHandler
    level: INFO
    formatter: detailed
    address: '/dev/log'

loggers:
  dwlabRuntimeEnvironment:
    level: WARNING
    handlers: [console, syslog]
    propagate: no
    
  dwlabObjectHandler:
    level: DEBUG
    handlers: [console, syslog]
    propagate: no

  dwlabSettingsFile:
    level: WARNING
    handlers: [console, syslog]
    propagate: no

  cmkSiteCreate:
    level: DEBUG
    handlers: [console, syslog]
    propagate: no


root:
  level: INFO
  handlers: [console, syslog]
